<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BookTracker{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
{% if messages %}
  {% for message in messages %}
    <div class="alert alert-{{ message.tags }}">
      {{ message }}
    </div>
  {% endfor %}
{% endif %}
<body class="bg-slate-50 text-slate-900 min-h-screen">
    <nav class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-6 py-4 flex justify-between items-center">
            <a href="{% url 'book_list' %}" class="text-2xl font-black text-emerald-600 tracking-tight italic">
                BOOK<span class="text-slate-800">TRK</span>
            </a>
            <div class="flex items-center space-x-6">
                {% if user.is_authenticated %}
                    <a href="{% url 'book_list' %}" class="text-sm font-semibold text-slate-600 hover:text-emerald-600 transition">Библиотека</a>
                    <a href="{% url 'book_create' %}" class="px-4 py-2 bg-emerald-600 text-white text-sm font-bold rounded-full hover:bg-emerald-700 transition shadow-md shadow-emerald-100">
                        + Добавить
                    </a>
                    <form action="{% url 'logout' %}" method="post" class="inline">
                        {% csrf_token %}
                        <button type="submit" class="text-sm font-bold text-slate-400 hover:text-red-500 transition">Выйти</button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}" class="text-sm font-bold text-slate-600 hover:text-emerald-600">Войти</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto px-6 py-10">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
